<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecurePass - Password Generator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <!-- Navigation -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="../index.html">
            🛡️ SecurePass
        </a>

        <div>
            <a href="../index.html" class="text-light text-decoration-none me-3">
                Home
            </a>

            <a href="password-checker.html" class="text-light text-decoration-none me-3">
                Password Checker
            </a>

            <a href="password-generator.html" class="text-light text-decoration-none me-3">
                Generator
            </a>

            <a href="security-tips.html" class="text-light text-decoration-none me-3">
                Awareness
            </a>

            <a href="about.html" class="text-light text-decoration-none">
                About
            </a>
        </div>

    </div>
</nav>


    <!-- Main Content -->

    <main class="container my-5">

        <div class="card shadow mx-auto"
             style="max-width: 650px;">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <div style="font-size: 50px;">
                        🔑
                    </div>

                    <h1 class="fw-bold">
                        Password Generator
                    </h1>

                    <p class="text-muted">
                        Create a strong and random password.
                    </p>

                </div>


                <!-- Generated Password -->

                <label class="form-label fw-bold">
                    Generated Password
                </label>

                <div class="input-group mb-4">

                    <input
                        type="text"
                        id="generatedPassword"
                        class="form-control"
                        readonly
                        placeholder="Your password will appear here"
                    >

                    <button
                        class="btn btn-outline-secondary"
                        id="copyPassword"
                        type="button"
                    >
                        Copy
                    </button>

                </div>


                <!-- Password Length -->

                <label class="form-label fw-bold">
                    Password Length:
                    <span id="lengthValue">12</span>
                </label>

                <input
                    type="range"
                    id="passwordLength"
                    class="form-range"
                    min="6"
                    max="30"
                    value="12"
                >


                <!-- Options -->

                <h5 class="mt-4">
                    Password Options
                </h5>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="includeUppercase"
                        checked
                    >

                    <label class="form-check-label">
                        Include uppercase letters (A-Z)
                    </label>

                </div>


                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="includeLowercase"
                        checked
                    >

                    <label class="form-check-label">
                        Include lowercase letters (a-z)
                    </label>

                </div>


                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="includeNumbers"
                        checked
                    >

                    <label class="form-check-label">
                        Include numbers (0-9)
                    </label>

                </div>


                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="includeSpecial"
                        checked
                    >

                    <label class="form-check-label">
                        Include special characters (!@#$%)
                    </label>

                </div>


                <!-- Generate Button -->

                <button
                    id="generatePassword"
                    class="btn btn-primary w-100 mt-4"
                >
                    🔄 Generate Password
                </button>


                <!-- Security Notice -->

                <div class="alert alert-info mt-4 mb-0">

                    🔒 <strong>Security Notice:</strong>

                    Passwords are generated locally in your browser
                    and are not stored or sent to a server.

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer class="bg-dark text-white text-center py-4">

        © 2026 SecurePass |
        Cybersecurity Awareness Project

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
